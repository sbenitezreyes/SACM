# SonarCloud configuration unified with Gradle plugin settings
sonar.projectKey=sbenitezreyes_SACM
sonar.organization=sbenitezreyes-1

# Sources & tests
sonar.sources=src/main/java
sonar.tests=src/test/java

# Compiled classes (main only)
sonar.java.binaries=build/classes/java/main

# Test reports & coverage
sonar.junit.reportPaths=build/test-results/test
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Optional exclusions (adjust as needed)
sonar.exclusions=**/config/**,**/dto/**,**/exception/**,**/integration/**
sonar.test.exclusions=**/integration/**

# Encoding
sonar.sourceEncoding=UTF-8